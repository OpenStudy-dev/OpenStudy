[project]
name = "openstudy-api"
version = "0.7.0"
description = "FastAPI backend for the OpenStudy app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.28",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
  "python-dateutil>=2.9",
  "tzdata>=2024.2",
  "mcp>=1.30,<2",  # 2.x drops mcp.server.fastmcp; 1.30 fixes GHSA-84m7-p3x7-pcfv et al.
  "pymupdf>=1.24",
  "pyotp>=2.9",
  "psycopg[binary,pool]>=3.2",
  "cryptography>=42",
  "jinja2>=3.1",
]

[tool.uv]
package = false
# Supply-chain cooldown: pinned date instead of rolling "N days" so security
# pins set today don't conflict with the cooldown window. Bump this when
# adopting new packages. Advanced 2026-10-24 (/depend): today minus 7 days.
exclude-newer = "2026-10-17T00:00:00Z"
# Per-package exceptions — each needs the advisory it exists for.
# certifi 2026.10.19 removes the compromised emSign ECC Root CA - G3
# (GHSA-6q48-6c7w-9gw2); released inside the 7-day window.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[dependency-groups]
dev = [
  "ruff>=0.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "dirty-equals>=0.8",
  "psycopg[binary,pool]>=3.2",
]
scripts = [
  "watchdog>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/_deprecated", "migrations/_archive"]

[tool.ruff.lint]
# Pinned explicitly: ruff 0.17 widened its defaults; CI enforces exactly
# the rule set the codebase was written against.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# main.py imports the routers + mcp_http AFTER setting the httpx log level —
# httpx logs the full request URL at INFO, which leaks the Telegram bot token.
# Imports must come after `logging.getLogger("httpx").setLevel(WARNING)`.
"app/main.py" = ["E402"]
# Test helper class with single-line method bodies — common pytest idiom.
"tests/services/test_email.py" = ["E702"]
